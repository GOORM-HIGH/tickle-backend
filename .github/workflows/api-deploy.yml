name: [API Server] Build & Deploy (SSH to Mac)

on:
  push:
    branches: [ develop ]
  pull_request:
    types: [ closed ]
    branches: [ develop ]

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Repository 코드 깃허브 러너에 내려받기
        uses: actions/checkout@v4

      - name: JDK 21 설치하기
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 프로젝트 Gradle 래퍼 파일에 실행 권한 부여
        run: chmod +x ./gradlew

      - name: Spring Boot 실행 JAR 빌드
        run: ./gradlew clean bootJar --no-daemon

      - name: 첫 번쨰 JAR 파일 경로 찾아서 저장
        id: artifact
        run: |
          ARTIFACT=$(ls build/libs/*.jar | head -n 1)
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "Using artifact: $ARTIFACT"

      - name: 러너에 빌드된 JAR 파일을 원격 컴퓨터에 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ steps.artifact.outputs.artifact }}
          target: /Users/${{ secrets.SSH_USER }}/apps/tickle/

      - name: 복사한 JAR을 실행 서버에서 재시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="$HOME/apps/tickle"
            mkdir -p "$APP_DIR/logs"

            # 최신 jar를 app.jar로 교체
            LATEST_JAR=$(ls -t "$APP_DIR"/*.jar 2>/dev/null | head -n 1)
            if [ -z "${LATEST_JAR:-}" ]; then
              echo "No JAR found in $APP_DIR" && exit 1
            fi
            mv -f "$LATEST_JAR" "$APP_DIR/app.jar"

            # 기존 프로세스 종료
            if [ -f "$APP_DIR/app.pid" ] && ps -p "$(cat "$APP_DIR/app.pid")" >/dev/null 2>&1; then
              echo "Stopping old process $(cat "$APP_DIR/app.pid")"
              kill -TERM "$(cat "$APP_DIR/app.pid")" || true
              for i in {1..10}; do ps -p "$(cat "$APP_DIR/app.pid")" >/dev/null 2>&1 || break; sleep 1; done
            fi

            # 새 프로세스 실행
            nohup java -jar "$APP_DIR/app.jar" --spring.profiles.active=local \
              > "$APP_DIR/logs/app.out" 2> "$APP_DIR/logs/app.err" &

            echo $! > "$APP_DIR/app.pid"
            echo "Started PID: $(cat "$APP_DIR/app.pid")"

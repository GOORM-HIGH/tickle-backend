name: "[API Server] Build & Deploy (SSH to Mac)"

on:
  push:
    branches: [ develop ]
  pull_request:
    types: [ closed ]
    branches: [ develop ]

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:

      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Checkout security repo (private)
        uses: actions/checkout@v4
        with:
          repository: GOORM-HIGH/tickle-security
          ref: main
          path: tickle-security
          token: ${{ secrets.SECURITY_REPO_TOKEN }}

      - name: Prepare application.yml from security repo
        run: |
          cp tickle-security/application.yml ./application.yml

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Build (Gradle Boot Jar)
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Find artifact
        id: artifact
        run: |
          ARTIFACT=$(ls build/libs/*.jar | head -n 1)
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "Using artifact: $ARTIFACT"

      - name: Upload JAR & application.yml to server (_incoming)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: |
            ${{ steps.artifact.outputs.artifact }}
            application.yml
          target: /Users/${{ secrets.SSH_USER }}/apps/tickle/_incoming/

      - name: Switch files & restart app on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="$HOME/apps/tickle"
            INCOMING="$APP_DIR/_incoming"
            mkdir -p "$APP_DIR/logs" "$INCOMING"

            rm -f "$APP_DIR/application.yml"
            if [ -f "$INCOMING/application.yml" ]; then
              mv -f "$INCOMING/application.yml" "$APP_DIR/application.yml"
              echo "application.yml updated."
            else
              echo "application.yml not found in _incoming" && exit 1
            fi

            LATEST_JAR=$(ls -t "$INCOMING"/*.jar 2>/dev/null | head -n 1 || true)
            if [ -z "${LATEST_JAR:-}" ]; then
              echo "No JAR found in $INCOMING" && exit 1
            fi
            mv -f "$LATEST_JAR" "$APP_DIR/app.jar"
            
            if [ -f "$APP_DIR/app.pid" ] && ps -p "$(cat "$APP_DIR/app.pid")" >/dev/null 2>&1; then
              echo "Stopping old process $(cat "$APP_DIR/app.pid")"
              kill -TERM "$(cat "$APP_DIR/app.pid")" || true
              for i in {1..10}; do ps -p "$(cat "$APP_DIR/app.pid")" >/dev/null 2>&1 || break; sleep 1; done
            fi

            nohup java -jar "$APP_DIR/app.jar" --spring.profiles.active=local \
              --spring.config.location="$APP_DIR/application.yml" \
              > "$APP_DIR/logs/app.out" 2> "$APP_DIR/logs/app.err" &

            echo $! > "$APP_DIR/app.pid"
            echo "Started PID: $(cat "$APP_DIR/app.pid")"

            find "$INCOMING" -type f -name '*.jar' -mtime +1 -delete || true
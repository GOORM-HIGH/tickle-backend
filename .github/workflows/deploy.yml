name: "[API Server] CI & Deploy"


on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ develop ]

jobs:
  ci:
    name: "PR CI (build only)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x ./gradlew
      - name: Assemble (no tests)
        run: ./gradlew clean assemble --no-daemon

  deploy-check:
    name: "PR Deploy Check (simulation)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout security repo
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: actions/checkout@v4
        with:
          repository: GOORM-HIGH/tickle-security
          ref: main
          path: tickle-security
          token: ${{ secrets.SECURITY_REPO_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x ./gradlew

      - name: Build BootJar (no test)
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Verify artifact exists
        run: |
          set -euo pipefail
          ARTIFACT=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1 || true)
          [ -n "${ARTIFACT:-}" ] || { echo "No bootJar built"; exit 1; }
          echo "Found artifact: $ARTIFACT"

      - name: Verify application.yml exists (internal PR only)
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        run: |
          set -euo pipefail
          ls -la tickle-security | sed -n '1,200p' || true
          test -f tickle-security/application.yml || { echo "application.yml missing"; exit 1; }
          echo "application.yml found"

  deploy:
    name: "Deploy to Mac Server"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: GOORM-HIGH/tickle-security
          ref: main
          path: tickle-security
          token: ${{ secrets.SECURITY_REPO_TOKEN }}

      - name: Prepare application.yml
        run: |
          set -euo pipefail
          cp tickle-security/application.yml ./application.yml
          echo "application.yml SHA256:"
          (command -v shasum >/dev/null && shasum -a 256 ./application.yml) || sha256sum ./application.yml
          ls -la ./application.yml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: chmod +x ./gradlew

      - name: Build (Gradle Boot Jar)
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Find artifact (exclude *-plain.jar)
        id: artifact
        run: |
          set -euo pipefail
          # 단일 모듈 우선
          CANDIDATE=$(ls -t build/libs/*.jar 2>/dev/null | grep -v 'plain' | head -n 1 || true)
          # 멀티모듈 보조
          if [ -z "${CANDIDATE:-}" ]; then
            CANDIDATE=$(ls -t */build/libs/*.jar 2>/dev/null | grep -v 'plain' | head -n 1 || true)
          fi
          [ -n "${CANDIDATE:-}" ] || { echo "❌ No non-plain JAR found"; exit 1; }
          echo "artifact=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "✅ Using artifact: $CANDIDATE"

      - name: Rename artifact to app.jar
        run: |
          set -euo pipefail
          cp "${{ steps.artifact.outputs.artifact }}" app.jar
          ls -lh app.jar

      - name: Ensure directories on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p "$HOME/apps/tickle/_incoming" "$HOME/apps/tickle/logs"

      # ✅ 업로드 직전 존재 검증 (여기서 실패하면 scp 안 감)
      - name: Sanity check before SCP
        run: |
          set -euo pipefail
          ls -la .
          test -f "./app.jar" || { echo "❌ app.jar missing"; exit 1; }
          test -f "./application.yml" || { echo "❌ application.yml missing"; exit 1; }


      - name: Upload JAR & application.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "app.jar,application.yml"
          target: "/Users/${{ secrets.SSH_USER }}/apps/tickle/_incoming/"

      - name: Switch & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="$HOME/apps/tickle"
            INCOMING="$APP_DIR/_incoming"


            # yml 교체
            rm -f "$APP_DIR/application.yml"
            mv -f "$INCOMING/application.yml" "$APP_DIR/application.yml"

            # jar는 항상 app.jar로 업로드됨
            test -f "$INCOMING/app.jar" || { echo "❌ app.jar not found in _incoming"; exit 1; }
            mv -f "$INCOMING/app.jar" "$APP_DIR/app.jar"

            # 기존 프로세스 종료
            if [ -f "$APP_DIR/app.pid" ] && ps -p "$(cat "$APP_DIR/app.pid")" >/dev/null 2>&1; then
              kill -TERM "$(cat "$APP_DIR/app.pid")" || true
              for i in {1..10}; do ps -p "$(cat "$APP_DIR/app.pid")" >/dev/null 2>&1 || break; sleep 1; done
            fi

            # 재기동
            nohup java -XX:-MaxFDLimit -Xms4g -Xmx8g -jar "$APP_DIR/app.jar" \
              --spring.profiles.active=prod \
              --spring.config.location="file:$APP_DIR/application.yml" \
            > "$APP_DIR/logs/app.out" 2> "$APP_DIR/logs/app.err" &

            echo $! > "$APP_DIR/app.pid"
            echo "✅ Started PID: $(cat "$APP_DIR/app.pid")"

            # (옵션) _incoming 오래된 잔여물 정리
            find "$INCOMING" -type f -mtime +7 -delete || true